<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Cuádruplos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="card shadow p-4 mx-auto style-card">
            <h2 class="text-center mb-4 text-primary fw-bold">Generador de Cuádruplos</h2>

            <div class="mb-3">
                <label for="ecuacion" class="form-label fw-semibold">Introduce la ecuación:</label>
                <input type="text" id="ecuacion" class="form-control" placeholder="Ej: z = (x + y / o) * r + ((a * b + k) / (c + d))" value="z = a * b + c / d - e">
            </div>

            <div id="seccionVariables" class="mb-3 p-3 bg-white border rounded shadow-sm" style="display: none;">
                <h5 class="fw-bold mb-3 text-secondary">Asigna los valores a las variables:</h5>
                <div id="contenedorVariables" class="row g-2"></div>
            </div>
            
            <button id="btnProcesar" class="btn btn-primary w-100 py-2 fw-bold">Generar Cuádruplos</button>

            <div id="resultadoContainer" class="table-responsive mt-4"></div>
        </div>
    </div>

    <script src="cuadruplos.js"></script>
</body>
</html>
