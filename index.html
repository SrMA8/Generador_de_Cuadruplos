<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Triplos y Cuádruplos</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="card shadow p-4 mx-auto style-card">
            <h2 class="text-center mb-4 text-primary fw-bold">Generador de Código Intermedio</h2>
            
            <!-- Campo de Ecuación -->
            <div class="mb-3">
                <label for="ecuacion" class="form-label fw-semibold">Introduce la ecuación:</label>
                <input type="text" id="ecuacion" class="form-control" placeholder="Ej: z = a * b + c / d - e" value="z = a * b + c / d - e">
            </div>

            <!-- Sección de Valores de Variables -->
            <div id="seccionVariables" class="mb-3 p-3 bg-white border rounded shadow-sm" style="display: none;">
                <h5 class="fw-bold mb-3 text-secondary">Asigna los valores a las variables:</h5>
                <div id="contenedorVariables" class="row g-2"></div>
            </div>
            
            <!-- Botones de Selección de Acción -->
            <div class="mb-4 text-center">
                <label class="form-label fw-semibold d-mb-2">¿Qué deseas generar?</label>
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    <button id="btnTriplos" class="btn btn-outline-primary px-4 fw-bold">Hacer Triplos</button>
                    <button id="btnCuadruplos" class="btn btn-outline-success px-4 fw-bold">Hacer Cuádruplos</button>
                    <button id="btnAmbas" class="btn btn-primary px-4 fw-bold">Hacer Ambas</button>
                </div>
            </div>
            
            <!-- Contenedor para las Tablas de Resultados -->
            <div id="resultadoContainer"></div>
        </div>
    </div>

    <!-- Script JS -->
    <script src="cuadruplos.js"></script>
</body>
</html>
